<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🌸 Vålerenga Vær</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --pink:     #ff8fab;
    --pink-lt:  #ffc8dd;
    --pink-bg:  #fff0f5;
    --lav:      #c8b6e2;
    --mint:     #b5ead7;
    --peach:    #ffcba4;
    --yellow:   #fde68a;
    --sky:      #bde0fe;
    --white:    #ffffff;
    --text:     #4a2d50;
    --soft:     #b49bbf;
    --shadow:   rgba(255,143,171,0.18);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #f0dcea;
    font-family: 'Nunito', sans-serif;
    color: var(--text);
  }

  /* ── Full-screen 9:16 shell ── */
  .screen {
    position: fixed;
    inset: 0;
    background: var(--pink-bg);
    display: grid;
    /* rows: rainbow | header | label+progress | carousel | dots+nav */
    grid-template-rows: 0.8vh 11vh 5vh 1fr 9vh;
    overflow: hidden;
  }

  /* ── Rainbow stripe ── */
  .rainbow {
    background: repeating-linear-gradient(90deg,
      var(--pink)   0%,    var(--pink)   14.3%,
      var(--lav)    14.3%, var(--lav)    28.6%,
      var(--mint)   28.6%, var(--mint)   42.9%,
      var(--peach)  42.9%, var(--peach)  57.1%,
      var(--yellow) 57.1%, var(--yellow) 71.4%,
      var(--sky)    71.4%, var(--sky)    85.7%,
      var(--pink-lt)85.7%, var(--pink-lt)100%);
  }

  /* ── Stars (decorative, clipped to screen) ── */
  .stars { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .star  { position: absolute; animation: floatStar linear infinite; opacity: 0; }
  @keyframes floatStar {
    0%   { transform: translateY(102vh) rotate(0deg);  opacity: 0; }
    8%   { opacity: 0.22; }
    92%  { opacity: 0.22; }
    100% { transform: translateY(-5vh)  rotate(360deg); opacity: 0; }
  }

  /* ── HEADER ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4vw;
    background: rgba(255,240,245,0.92);
    backdrop-filter: blur(8px);
    position: relative; z-index: 5;
  }
  .h-loc  { font-size: 1.8vh; font-weight: 900; letter-spacing: 0.22em; text-transform: uppercase; color: var(--soft); }
  .h-name { font-family: 'Zen Maru Gothic', sans-serif; font-size: 3.8vh; font-weight: 900; color: var(--pink); line-height: 1; }
  .h-right{ text-align: right; }
  .h-date { font-size: 1.7vh; font-weight: 800; color: var(--soft); }
  .h-day  { font-family: 'Zen Maru Gothic', sans-serif; font-size: 2.8vh; font-weight: 700; color: var(--text); }

  /* ── LABEL + PROGRESS ── */
  .top-bar {
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 0 4vw;
    gap: 0.6vh;
    position: relative; z-index: 5;
  }
  .label-row {
    display: flex; justify-content: space-between; align-items: center;
  }
  .slide-label  { font-size: 1.5vh; font-weight: 900; letter-spacing: 0.24em; text-transform: uppercase; color: var(--soft); }
  .slide-count  { font-size: 1.4vh; font-weight: 800; color: var(--pink-lt); }
  .prog-wrap {
    height: 0.6vh; background: var(--pink-lt); border-radius: 1vh; overflow: hidden;
  }
  .prog-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--pink), var(--lav), var(--pink));
    background-size: 200% 100%;
    border-radius: 1vh;
    animation: shimmer 2s linear infinite;
  }
  @keyframes shimmer { 0%{background-position:0%}100%{background-position:200%} }

  /* ── CAROUSEL ── */
  .carousel {
    overflow: hidden;
    padding: 0 3vw;
    position: relative; z-index: 5;
  }
  .track {
    display: flex;
    height: 100%;
    transition: transform 0.52s cubic-bezier(0.4,0,0.2,1);
    will-change: transform;
  }
  .slide {
    min-width: 100%; height: 100%;
    flex-shrink: 0;
    display: flex; flex-direction: column;
  }

  /* ── CARD ── */
  .card {
    flex: 1;
    background: var(--white);
    border: 0.5vw solid var(--pink-lt);
    border-radius: 4vw;
    box-shadow: 0 1vh 4vh var(--shadow);
    padding: 2.5vh 4vw 2vh;
    display: flex; flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .card::before, .card::after {
    content: '🌸'; position: absolute;
    font-size: 2vh; opacity: 0.25;
  }
  .card::before { top: 1.2vh; left: 2vw; }
  .card::after  { top: 1.2vh; right: 2vw; }

  .card-title {
    font-size: 1.5vh; font-weight: 900; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--soft); margin-bottom: 1.8vh;
    text-align: center;
  }

  /* ── BOTTOM BAR: dots + nav ── */
  .bottom-bar {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1vh;
    position: relative; z-index: 5;
    padding-bottom: 0.5vh;
  }
  .dots { display: flex; gap: 1.5vw; }
  .dot {
    width: 2vw; height: 2vw; border-radius: 50%;
    background: var(--pink-lt); border: none; cursor: pointer;
    transition: background 0.3s, width 0.3s, border-radius 0.3s;
    padding: 0;
  }
  .dot.active { background: var(--pink); width: 6vw; border-radius: 1vw; }
  .dot:hover  { background: var(--pink); }
  .navs { display: flex; gap: 4vw; }
  .nav-btn {
    background: var(--white); border: 0.5vw solid var(--pink-lt);
    border-radius: 50%; width: 6vh; height: 6vh;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 2.8vh; color: var(--pink); font-weight: 900;
    box-shadow: 0 0.5vh 2vh var(--shadow);
    transition: background 0.2s, transform 0.15s;
  }
  .nav-btn:hover { background: var(--pink-lt); transform: scale(1.1); }

  /* ══════════════════════════════════════════
     SLIDE CONTENT — all fluid vh/vw units
  ══════════════════════════════════════════ */

  /* ── Hero ── */
  .hero-body {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0;
  }
  .hero-icon {
    font-size: 16vh; line-height: 1;
    margin-bottom: 0.5vh;
    animation: bob 3.5s ease-in-out infinite;
    filter: drop-shadow(0 1vh 3vh rgba(255,143,171,0.45));
  }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-1.5vh) rotate(3deg)} }
  .hero-temp-row { display: flex; align-items: flex-start; gap: 0; margin-bottom: 0.4vh; }
  .hero-temp {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14vh; font-weight: 900; color: var(--text); line-height: 0.9;
    text-shadow: 0.5vw 0.5vw 0 var(--pink-lt);
  }
  .hero-deg  { font-family: 'Zen Maru Gothic', sans-serif; font-size: 5vh; font-weight: 700; color: var(--pink); margin-top: 2vh; }
  .hero-cond { font-size: 3.2vh; font-weight: 900; color: var(--pink); text-align: center; margin-bottom: 0.6vh; }
  .hero-feel { font-size: 1.9vh; font-weight: 700; color: var(--soft); margin-bottom: 2.5vh; }
  .hero-pills { display: flex; flex-wrap: wrap; gap: 1.2vw; justify-content: center; }
  .hero-pill  {
    background: var(--pink-bg); border: 0.4vw solid var(--pink-lt);
    border-radius: 5vw; padding: 1.2vh 3vw;
    font-size: 1.8vh; font-weight: 800; color: var(--text);
    display: flex; align-items: center; gap: 1vw;
  }

  /* ── Calendar ── */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5vh; }
  .cal-mname { font-family: 'Zen Maru Gothic', sans-serif; font-size: 3.2vh; font-weight: 700; color: var(--pink); }
  .cal-navs  { display: flex; gap: 2vw; }
  .cal-btn   {
    background: var(--pink-bg); border: 0.4vw solid var(--pink-lt);
    border-radius: 1.5vw; width: 5vw; height: 5vw; max-width: 32px; max-height: 32px;
    cursor: pointer; font-size: 2.2vh; color: var(--pink); font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .cal-btn:hover { background: var(--pink-lt); }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 0.5vh; flex: 1; align-content: start; }
  .cal-dow  { font-size: 1.3vh; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft); text-align: center; padding-bottom: 0.8vh; }
  .cal-day  {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 1vw; font-size: 1.8vh; font-weight: 700; color: var(--text);
  }
  .cal-day.other  { color: var(--soft); opacity: 0.3; }
  .cal-day.wkend  { color: #e05d7a; }
  .cal-day.today  {
    background: var(--pink); color: white; font-weight: 900;
    box-shadow: 0 0.4vh 1.2vh rgba(255,143,171,0.55);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{box-shadow:0 0.4vh 1.2vh rgba(255,143,171,0.55)} 50%{box-shadow:0 0.4vh 2.5vh rgba(255,143,171,0.85)} }

  /* ── Details ── */
  .det-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 1.4vh; flex: 1; align-content: start;
  }
  .d-tile {
    background: var(--pink-bg); border: 0.4vw solid var(--pink-lt);
    border-radius: 3vw; padding: 2vh 2vw; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .d-tile:nth-child(1){border-color:var(--lav);    background:#f3eeff}
  .d-tile:nth-child(2){border-color:var(--mint);   background:#eefff8}
  .d-tile:nth-child(3){border-color:var(--peach);  background:#fff5ee}
  .d-tile:nth-child(4){border-color:var(--yellow); background:#fffbe8}
  .d-tile:nth-child(5){border-color:var(--sky);    background:#eef6ff}
  .d-tile:nth-child(6){border-color:var(--pink-lt);background:var(--pink-bg)}
  .d-icon { font-size: 3.8vh; margin-bottom: 0.6vh; }
  .d-val  { font-family: 'Zen Maru Gothic', sans-serif; font-size: 3.2vh; font-weight: 700; color: var(--text); }
  .d-lbl  { font-size: 1.2vh; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; color: var(--soft); margin-top: 0.3vh; }

  /* ── Sun ── */
  .sun-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2.5vh; }
  .sun-row  { display: flex; gap: 3vw; }
  .sun-half {
    flex: 1; border-radius: 3vw; padding: 2.5vh 3vw; text-align: center;
    background: linear-gradient(135deg, #fffbea, #fff3d6);
    border: 0.5vw solid var(--yellow);
  }
  .sun-half:last-child { background: linear-gradient(135deg,#f3eeff,#ede4ff); border-color: var(--lav); }
  .sun-icon { font-size: 6vh; display: block; margin-bottom: 1vh; }
  .sun-time { font-family: 'Zen Maru Gothic', sans-serif; font-size: 5.5vh; font-weight: 700; color: var(--text); }
  .sun-lbl  { font-size: 1.3vh; font-weight: 900; color: var(--soft); text-transform: uppercase; letter-spacing: 0.15em; margin-top: 0.6vh; }
  .sun-bar-wrap {
    position: relative; height: 1.2vh; background: var(--pink-lt);
    border-radius: 1vh; overflow: hidden;
  }
  .sun-bar { position: absolute; left: 0; top: 0; height: 100%; background: linear-gradient(90deg,var(--yellow),var(--peach)); border-radius: 1vh; }
  .sun-dot  {
    position: absolute; top: 50%;
    width: 2.4vh; height: 2.4vh; background: var(--yellow);
    border: 0.4vh solid white; border-radius: 50%;
    transform: translateY(-50%) translateX(-50%);
    box-shadow: 0 0 1.5vh rgba(253,230,138,0.9);
  }
  .sun-dl   { font-size: 1.8vh; font-weight: 800; color: var(--soft); text-align: center; }

  /* ── Hourly ── */
  .hour-grid {
    display: grid; grid-template-columns: repeat(4,1fr);
    gap: 1.2vh; flex: 1; align-content: start;
  }
  .h-tile {
    background: var(--pink-bg); border: 0.4vw solid var(--pink-lt);
    border-radius: 2.5vw; padding: 1.5vh 1vw; text-align: center;
  }
  .h-tile.now { border-color: var(--pink); background: #fff0f5; }
  .h-time     { font-size: 1.3vh; font-weight: 900; color: var(--soft); }
  .h-icon     { font-size: 3.5vh; margin: 0.6vh 0; display: block; }
  .h-temp     { font-size: 2.2vh; font-weight: 900; color: var(--text); }
  .h-precip   { font-size: 1.3vh; font-weight: 700; color: var(--sky); margin-top: 0.3vh; min-height: 1.8vh; }

  /* ── Daily ── */
  .day-list { display: flex; flex-direction: column; gap: 1.2vh; flex: 1; }
  .day-row  {
    display: flex; align-items: center; gap: 2vw;
    background: var(--pink-bg); border: 0.4vw solid var(--pink-lt);
    border-radius: 3vw; padding: 1.4vh 3vw; flex: 1;
  }
  .day-name  { font-size: 1.8vh; font-weight: 900; color: var(--soft); width: 14vw; flex-shrink: 0; }
  .day-icon  { font-size: 3vh; flex-shrink: 0; }
  .day-bar-w { flex: 1; position: relative; height: 1vh; border-radius: 1vh; background: var(--pink-lt); overflow: hidden; }
  .day-bar   { position: absolute; height: 100%; border-radius: 1vh; background: linear-gradient(90deg,var(--sky),var(--pink)); }
  .day-temps { display: flex; gap: 2vw; flex-shrink: 0; }
  .day-max   { font-size: 2vh; font-weight: 900; color: var(--text); min-width: 8vw; text-align: right; }
  .day-min   { font-size: 2vh; font-weight: 700; color: var(--soft); min-width: 8vw; }
  .day-mm    { font-size: 1.4vh; font-weight: 700; color: var(--sky); width: 10vw; text-align: right; flex-shrink: 0; }

  /* Loading */
  .loading {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 2vh; font-weight: 800; color: var(--soft);
    animation: bob2 0.9s ease-in-out infinite alternate;
  }
  @keyframes bob2 { from{transform:translateY(0)} to{transform:translateY(-1vh)} }

  /* Pause badge */
  .pause {
    position: absolute; top: 1.5vh; right: 4vw; z-index: 20;
    background: var(--pink-lt); border-radius: 2vw;
    padding: 0.5vh 2vw; font-size: 1.3vh; font-weight: 900;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--pink); opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .screen:hover .pause { opacity: 1; }

  /* Heart */
  .heart { color: var(--pink); animation: hb 1.4s ease-in-out infinite; display: inline-block; }
  @keyframes hb { 0%,100%{transform:scale(1)} 14%{transform:scale(1.3)} 28%{transform:scale(1)} 42%{transform:scale(1.15)} }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="stars" id="stars"></div>
  <div class="pause" id="pause-badge">⏸ pauset</div>

  <div class="rainbow"></div>

  <!-- HEADER -->
  <header class="header">
    <div>
      <div class="h-loc">🗺️ Vålerenga · Oslo</div>
      <div class="h-name">Vær ✿</div>
    </div>
    <div class="h-right">
      <div class="h-date" id="hdate"></div>
      <div class="h-day"  id="hday"></div>
    </div>
  </header>

  <!-- LABEL + PROGRESS -->
  <div class="top-bar">
    <div class="label-row">
      <div class="slide-label" id="slide-label"></div>
      <div class="slide-count" id="slide-count"></div>
    </div>
    <div class="prog-wrap"><div class="prog-bar" id="prog-bar"></div></div>
  </div>

  <!-- CAROUSEL -->
  <div class="carousel">
    <div class="track" id="track">

      <!-- 0 Hero -->
      <div class="slide">
        <div class="card" data-label="🌤️ Været nå">
          <div id="hero-inner"><div class="loading">✨ Laster vær… ✨</div></div>
        </div>
      </div>

      <!-- 1 Calendar -->
      <div class="slide">
        <div class="card" data-label="📅 Kalender">
          <div class="card-title">📅 Kalender</div>
          <div class="cal-head">
            <div class="cal-mname" id="cal-mname"></div>
            <div class="cal-navs">
              <button class="cal-btn" onclick="changeMonth(-1)">‹</button>
              <button class="cal-btn" onclick="changeMonth(1)">›</button>
            </div>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
      </div>

      <!-- 2 Details -->
      <div class="slide">
        <div class="card" data-label="🌡️ Detaljer">
          <div class="card-title">🌡️ Detaljer</div>
          <div class="det-grid" id="det-grid">
            <div class="loading" style="grid-column:1/-1">✨ Laster… ✨</div>
          </div>
        </div>
      </div>

      <!-- 3 Sun -->
      <div class="slide">
        <div class="card" data-label="☀️ Sol i dag">
          <div class="card-title">☀️ Sol i dag</div>
          <div class="sun-body" id="sun-body">
            <div class="loading">✨ Laster… ✨</div>
          </div>
        </div>
      </div>

      <!-- 4 Hourly -->
      <div class="slide">
        <div class="card" data-label="🕐 Timesvarsel">
          <div class="card-title">🕐 Timesvarsel — neste 12t</div>
          <div class="hour-grid" id="hour-grid">
            <div class="loading" style="grid-column:1/-1">✨ Laster… ✨</div>
          </div>
        </div>
      </div>

      <!-- 5 Daily -->
      <div class="slide">
        <div class="card" data-label="📆 7-dagers varsel">
          <div class="card-title">📆 7-dagers varsel</div>
          <div class="day-list" id="day-list">
            <div class="loading">✨ Laster… ✨</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <div class="dots" id="dots"></div>
    <div class="navs">
      <button class="nav-btn" onclick="goSlide(-1)">‹</button>
      <button class="nav-btn" onclick="goSlide(1)">›</button>
    </div>
  </div>
</div>

<script>
  const LAT=59.9127, LON=10.7745, DUR=5000;

  // Stars
  const SC='✦✧⋆·✩★♡✿◌❋'.split('');
  const starsEl=document.getElementById('stars');
  for(let i=0;i<22;i++){
    const s=document.createElement('div'); s.className='star';
    s.textContent=SC[Math.floor(Math.random()*SC.length)];
    s.style.cssText=`left:${Math.random()*100}%;font-size:${10+Math.random()*12}px;`
      +`color:${'#ff8fab,#c8b6e2,#b5ead7,#fde68a,#bde0fe'.split(',')[Math.floor(Math.random()*5)]};`
      +`animation-duration:${18+Math.random()*20}s;animation-delay:${-Math.random()*32}s`;
    starsEl.appendChild(s);
  }

  // Date
  const DAYS=['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag'];
  const MSHORT=['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
  const MFULL=['Januar','Februar','Mars','April','Mai','Juni','Juli','August','September','Oktober','November','Desember'];
  function updateDate(){
    const n=new Date();
    document.getElementById('hdate').textContent=`${n.getDate()}. ${MSHORT[n.getMonth()]} ${n.getFullYear()}`;
    document.getElementById('hday').textContent=DAYS[n.getDay()];
  }
  updateDate(); setInterval(updateDate,60000);

  // Carousel
  const track=document.getElementById('track');
  const slides=Array.from(document.querySelectorAll('.slide'));
  const cards=slides.map(s=>s.querySelector('.card'));
  const N=slides.length;
  let cur=0, paused=false, timer=null, pStart=null, pRem=DUR;
  const pBar=document.getElementById('prog-bar');
  const lbl=document.getElementById('slide-label');
  const cnt=document.getElementById('slide-count');
  const dotsEl=document.getElementById('dots');

  for(let i=0;i<N;i++){
    const d=document.createElement('button'); d.className='dot'+(i===0?' active':'');
    d.addEventListener('click',()=>jumpTo(i)); dotsEl.appendChild(d);
  }
  const allDots=()=>Array.from(dotsEl.querySelectorAll('.dot'));

  function setSlide(i){
    cur=((i%N)+N)%N;
    track.style.transform=`translateX(-${cur*100}%)`;
    allDots().forEach((d,j)=>d.classList.toggle('active',j===cur));
    lbl.textContent=cards[cur].dataset.label||'';
    cnt.textContent=`${cur+1} / ${N}`;
  }
  function jumpTo(i){ setSlide(i); resetProg(DUR); }
  function goSlide(d){ setSlide(cur+d); resetProg(DUR); }

  function resetProg(d){
    clearTimeout(timer);
    pBar.style.transition='none'; pBar.style.width='0%'; pBar.offsetHeight;
    pRem=d; if(!paused) startProg(d);
  }
  function startProg(d){
    pBar.style.transition=`width ${d}ms linear`; pBar.style.width='100%';
    pStart=performance.now();
    timer=setTimeout(()=>{ setSlide(cur+1); resetProg(DUR); },d);
  }

  const sc=document.getElementById('screen');
  sc.addEventListener('mouseenter',()=>{
    if(paused)return; paused=true; clearTimeout(timer);
    const el=performance.now()-pStart;
    pRem=Math.max(0,pRem-el);
    const w=getComputedStyle(pBar).width, pw=getComputedStyle(pBar.parentElement).width;
    pBar.style.transition='none'; pBar.style.width=(parseFloat(w)/parseFloat(pw)*100).toFixed(2)+'%';
  });
  sc.addEventListener('mouseleave',()=>{
    if(!paused)return; paused=false; startProg(pRem);
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight')goSlide(1);
    if(e.key==='ArrowLeft')goSlide(-1);
  });

  setSlide(0); resetProg(DUR);

  // Calendar
  let calDate=new Date();
  function renderCal(){
    const today=new Date(), y=calDate.getFullYear(), m=calDate.getMonth();
    document.getElementById('cal-mname').textContent=`${MFULL[m]} ${y}`;
    const g=document.getElementById('cal-grid'); g.innerHTML='';
    ['Man','Tir','Ons','Tor','Fre','Lør','Søn'].forEach((d,i)=>{
      const el=document.createElement('div'); el.className='cal-dow';
      if(i>=5)el.style.color='var(--pink)'; el.textContent=d; g.appendChild(el);
    });
    const sd=(new Date(y,m,1).getDay()+6)%7, dim=new Date(y,m+1,0).getDate(), prev=new Date(y,m,0).getDate();
    for(let i=0;i<sd;i++){const el=document.createElement('div');el.className='cal-day other';el.textContent=prev-sd+1+i;g.appendChild(el);}
    for(let d=1;d<=dim;d++){
      const el=document.createElement('div');const dow=new Date(y,m,d).getDay();
      el.className='cal-day'+(dow===0||dow===6?' wkend':'');el.textContent=d;
      if(d===today.getDate()&&m===today.getMonth()&&y===today.getFullYear())el.classList.add('today');
      g.appendChild(el);
    }
    const rem=(sd+dim)%7===0?0:7-(sd+dim)%7;
    for(let d=1;d<=rem;d++){const el=document.createElement('div');el.className='cal-day other';el.textContent=d;g.appendChild(el);}
  }
  function changeMonth(d){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+d,1);renderCal();}
  renderCal();

  // Weather helpers
  function wInfo(c,day){
    const m={0:{i:day?'☀️':'🌙',l:'Klarvær'},1:{i:day?'🌤️':'🌙',l:'Mest klart'},2:{i:'⛅',l:'Delvis skyet'},3:{i:'☁️',l:'Overskyet'},
      45:{i:'🌫️',l:'Tåke'},48:{i:'🌫️',l:'Rimtåke'},51:{i:'🌦️',l:'Lett yr'},53:{i:'🌦️',l:'Yr'},55:{i:'🌧️',l:'Kraftig yr'},
      61:{i:'🌧️',l:'Lett regn'},63:{i:'🌧️',l:'Regn'},65:{i:'🌧️',l:'Kraftig regn'},71:{i:'🌨️',l:'Lett snø'},
      73:{i:'❄️',l:'Snø'},75:{i:'❄️',l:'Kraftig snø'},77:{i:'🌨️',l:'Snøkorn'},80:{i:'🌦️',l:'Regnbyger'},
      81:{i:'🌧️',l:'Kraftige byger'},82:{i:'⛈️',l:'Voldsomme byger'},85:{i:'🌨️',l:'Snøbyger'},
      86:{i:'🌨️',l:'Kraftige snøbyger'},95:{i:'⛈️',l:'Tordenvær'},96:{i:'⛈️',l:'Torden og hagl'},99:{i:'⛈️',l:'Kraftig torden'}};
    return m[c]||{i:'🌡️',l:'Ukjent'};
  }
  function wDir(d){return['N','NØ','Ø','SØ','S','SV','V','NV'][Math.round(d/45)%8];}
  function f2(n){return String(n).padStart(2,'0');}
  function fT(iso){const d=new Date(iso);return`${f2(d.getHours())}:${f2(d.getMinutes())}`;}
  function uvL(u){if(u<=2)return'Lav';if(u<=5)return'Moderat';if(u<=7)return'Høy';if(u<=10)return'Svært høy';return'Ekstremt';}
  function bf(ms){const sc=[0.3,1.6,3.4,5.5,8,10.8,13.9,17.2,20.8,24.5,28.5,32.7];let b=0;sc.forEach((v,i)=>{if(ms>=v)b=i+1;});return b;}

  async function loadWeather(){
    try{
      const url=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
        +`&current=temperature_2m,apparent_temperature,weathercode,windspeed_10m,winddirection_10m,`
        +`relativehumidity_2m,is_day,precipitation,surface_pressure,visibility,uv_index,cloudcover`
        +`&hourly=temperature_2m,weathercode,precipitation_probability,is_day`
        +`&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,sunrise,sunset`
        +`&wind_speed_unit=ms&timezone=Europe%2FOslo&forecast_days=7`;
      const data=await(await fetch(url)).json();
      const c=data.current,h=data.hourly,d=data.daily,now=new Date();
      const info=wInfo(c.weathercode,c.is_day);
      const temp=Math.round(c.temperature_2m), feels=Math.round(c.apparent_temperature);
      const wind=c.windspeed_10m.toFixed(1), dir=wDir(c.winddirection_10m);
      const hum=c.relativehumidity_2m, precip=c.precipitation;
      const pres=Math.round(c.surface_pressure);
      const vis=c.visibility!=null?(c.visibility/1000).toFixed(1):'–';
      const uv=c.uv_index!=null?Math.round(c.uv_index):'–';
      const cloud=c.cloudcover!=null?c.cloudcover:'–';
      const bft=bf(c.windspeed_10m);

      // Hero
      document.getElementById('hero-inner').innerHTML=`
        <div class="hero-body">
          <div class="hero-icon">${info.i}</div>
          <div class="hero-temp-row"><div class="hero-temp">${temp}</div><div class="hero-deg">°C</div></div>
          <div class="hero-cond">${info.l}</div>
          <div class="hero-feel">Føles som ${feels}°C · ${DAYS[now.getDay()]} ${now.getDate()}. ${MSHORT[now.getMonth()]}</div>
          <div class="hero-pills">
            <div class="hero-pill">💨 ${wind} m/s ${dir}</div>
            <div class="hero-pill">💧 ${hum}%</div>
            <div class="hero-pill">🌧️ ${precip} mm</div>
            <div class="hero-pill">🌬️ Bf ${bft}</div>
          </div>
        </div>`;

      // Details
      document.getElementById('det-grid').innerHTML=`
        <div class="d-tile"><div class="d-icon">🌡️</div><div class="d-val">${pres} hPa</div><div class="d-lbl">Lufttrykk</div></div>
        <div class="d-tile"><div class="d-icon">👁️</div><div class="d-val">${vis} km</div><div class="d-lbl">Sikt</div></div>
        <div class="d-tile"><div class="d-icon">🔆</div><div class="d-val">${uv}</div><div class="d-lbl">UV · ${uv!=='–'?uvL(uv):'–'}</div></div>
        <div class="d-tile"><div class="d-icon">☁️</div><div class="d-val">${cloud}%</div><div class="d-lbl">Skydekke</div></div>
        <div class="d-tile"><div class="d-icon">💨</div><div class="d-val">${wind} m/s</div><div class="d-lbl">Vind</div></div>
        <div class="d-tile"><div class="d-icon">💧</div><div class="d-val">${hum}%</div><div class="d-lbl">Fuktighet</div></div>`;

      // Sun
      const srMs=new Date(d.sunrise[0]).getTime(), ssMs=new Date(d.sunset[0]).getTime();
      const tMs=ssMs-srMs, pct=tMs>0?(Math.max(0,Math.min(Date.now()-srMs,tMs))/tMs*100).toFixed(1):0;
      const dlM=Math.round(tMs/60000);
      document.getElementById('sun-body').innerHTML=`
        <div class="sun-row">
          <div class="sun-half"><span class="sun-icon">🌅</span><div class="sun-time">${fT(d.sunrise[0])}</div><div class="sun-lbl">Soloppgang</div></div>
          <div class="sun-half"><span class="sun-icon">🌇</span><div class="sun-time">${fT(d.sunset[0])}</div><div class="sun-lbl">Solnedgang</div></div>
        </div>
        <div>
          <div class="sun-bar-wrap"><div class="sun-bar" style="width:${pct}%"></div><div class="sun-dot" style="left:${pct}%"></div></div>
          <div class="sun-dl" style="margin-top:1vh">☀️ ${Math.floor(dlM/60)}t ${dlM%60}m dagslys</div>
        </div>`;

      // Hourly
      const nowIso=new Date().toISOString().slice(0,13);
      let si=h.time.findIndex(t=>t.slice(0,13)>=nowIso); if(si<0)si=0;
      document.getElementById('hour-grid').innerHTML=
        h.time.slice(si,si+12).map((t,i)=>{
          const idx=si+i,hi=wInfo(h.weathercode[idx],h.is_day[idx]),pp=h.precipitation_probability[idx];
          return `<div class="h-tile${i===0?' now':''}">
            <div class="h-time">${i===0?'Nå':f2(new Date(t).getHours())+':00'}</div>
            <span class="h-icon">${hi.i}</span>
            <div class="h-temp">${Math.round(h.temperature_2m[idx])}°</div>
            <div class="h-precip">${pp>0?'💧'+pp+'%':''}</div>
          </div>`;
        }).join('');

      // Daily
      const allT=d.temperature_2m_max.concat(d.temperature_2m_min);
      const gMax=Math.max(...allT),gMin=Math.min(...allT),tR=gMax-gMin||1;
      const DN=['Søn','Man','Tir','Ons','Tor','Fre','Lør'];
      document.getElementById('day-list').innerHTML=
        d.time.map((date,i)=>{
          const dObj=new Date(date+'T12:00:00');
          const nm=i===0?'I dag':i===1?'I morgen':DN[dObj.getDay()];
          const mx=Math.round(d.temperature_2m_max[i]),mn=Math.round(d.temperature_2m_min[i]);
          const di=wInfo(d.weathercode[i],1),dp=d.precipitation_sum[i]!=null?d.precipitation_sum[i].toFixed(1):'0';
          return `<div class="day-row">
            <span class="day-name">${nm}</span>
            <span class="day-icon">${di.i}</span>
            <div class="day-bar-w"><div class="day-bar" style="left:${((mn-gMin)/tR*100).toFixed(1)}%;width:${((mx-mn)/tR*100).toFixed(1)}%"></div></div>
            <div class="day-temps"><span class="day-max">${mx}°</span><span class="day-min">${mn}°</span></div>
            <span class="day-mm">${dp>0?'💧'+dp+'mm':''}</span>
          </div>`;
        }).join('');

    }catch(e){
      console.error(e);
      document.getElementById('hero-inner').innerHTML='<div class="loading">😿 Feil ved lasting!</div>';
    }
  }

  loadWeather();
  setInterval(loadWeather,15000);
</script>
</body>
</html>
